<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .panel {
            position: absolute;
            background: rgba(24, 24, 28, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #toolbar {
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        #sidebar {
            top: 15px;
            right: 15px;
            width: 290px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #timeline-panel {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 30px);
            max-width: 950px;
        }
        .timeline-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .frame-strip-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 6px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .frame-card {
            min-width: 50px;
            height: 45px;
            background: #1e2024;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
            color: #aaa;
            transition: all 0.2s ease;
        }
        .frame-card:hover {
            border-color: #007acc;
            color: #fff;
        }
        .frame-card.active {
            background: #007acc;
            border-color: #007acc;
            color: #fff;
            font-weight: bold;
        }
        .mode-selector {
            display: flex;
            background: #111;
            border-radius: 6px;
            padding: 2px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .mode-btn {
            background: transparent;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            color: #888;
            border-radius: 4px;
        }
        .mode-btn.active {
            background: #007acc;
            color: #fff;
        }
        h1 {
            font-size: 15px;
            font-weight: 600;
            color: #007acc;
            margin-bottom: 6px;
        }
        .section {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }
        button {
            background: #2a2d32;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #007acc;
            border-color: #007acc;
        }
        .btn-danger:hover {
            background: #d9534f;
            border-color: #d9534f;
        }
        .btn-record {
            background: #b32d2e;
            border-color: #e53935;
            font-weight: bold;
        }
        .btn-record:hover {
            background: #e53935;
            border-color: #ff5252;
        }
        .btn-record.recording {
            animation: pulse 1.2s infinite;
            background: #ff1744;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .input-group label {
            color: #ccc;
        }
        input[type="number"], input[type="text"], input[type="color"], input[type="file"], select {
            background: #111;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        input[type="number"] {
            width: 55px;
        }
        input[type="color"] {
            padding: 0;
            width: 40px;
            height: 24px;
            cursor: pointer;
        }
        .vector3-input {
            display: flex;
            gap: 4px;
        }
        #stats {
            position: absolute;
            top: 15px;
            right: 320px;
            font-size: 11px;
            color: #aaa;
            background: rgba(0,0,0,0.6);
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-success {
            background: #2e7d32;
            border-color: #4caf50;
        }
        .btn-success:hover {
            background: #388e3c;
            border-color: #66bb6a;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="toolbar" class="panel">
        <strong style="font-size: 14px; margin-right: 8px;">🧊 3D Model Engine</strong>
        
        <!-- Gestión de Proyecto (Nuevo, Cargar, Guardar) -->
        <div style="display: flex; gap: 6px;">
            <button onclick="newProject()">📄 Nuevo</button>
            <button onclick="document.getElementById('file-load-project').click()">📂 Cargar</button>
            <button class="btn-success" onclick="saveProject()">💾 Guardar</button>
            <input type="file" id="file-load-project" accept=".json" style="display:none;" onchange="loadProject(event)">
        </div>

        <span style="color: rgba(255,255,255,0.2);">|</span>

        <div class="mode-selector">
            <button id="btn-mode-model" class="mode-btn active" onclick="switchMode('modeling')">📐 Modelado</button>
            <button id="btn-mode-anim" class="mode-btn" onclick="switchMode('animation')">🎬 Animación</button>
        </div>

        <span style="color: rgba(255,255,255,0.2);">|</span>

        <div id="object-tools" style="display: flex; gap: 6px;">
            <button onclick="addPrimitive('cube')">+ Cubo</button>
            <button onclick="addPrimitive('sphere')">+ Esfera</button>
            <button onclick="addPrimitive('cylinder')">+ Cilindro</button>
            <button onclick="addPrimitive('plane')">+ Plano</button>
            <button onclick="addPrimitive('torus')">+ Toro</button>
        </div>
    </div>

    <div id="sidebar" class="panel">
        <div>
            <h1 id="panel-title">⚙️ Inspector</h1>
            <div id="no-selection" style="color: #666; font-size: 12px;">Haz clic en un objeto para seleccionarlo.</div>
        </div>

        <div id="inspector-content" style="display: none;" class="section">
            <div class="input-group">
                <label>Nombre:</label>
                <input type="text" id="obj-name" style="width: 120px;" onchange="updateSelectedObject()">
            </div>
            
            <div class="section-title" style="margin-top: 10px;">Transformación</div>
            <div class="input-group">
                <label>Posición (X,Y,Z)</label>
                <div class="vector3-input">
                    <input type="number" id="pos-x" step="0.1" oninput="updateTransformFromUI()">
                    <input type="number" id="pos-y" step="0.1" oninput="updateTransformFromUI()">
                    <input type="number" id="pos-z" step="0.1" oninput="updateTransformFromUI()">
                </div>
            </div>
            <div class="input-group">
                <label>Escala (X,Y,Z)</label>
                <div class="vector3-input">
                    <input type="number" id="scale-x" step="0.1" oninput="updateTransformFromUI()">
                    <input type="number" id="scale-y" step="0.1" oninput="updateTransformFromUI()">
                    <input type="number" id="scale-z" step="0.1" oninput="updateTransformFromUI()">
                </div>
            </div>
            <div class="input-group">
                <label>Rotación (°)</label>
                <div class="vector3-input">
                    <input type="number" id="rot-x" step="5" oninput="updateTransformFromUI()">
                    <input type="number" id="rot-y" step="5" oninput="updateTransformFromUI()">
                    <input type="number" id="rot-z" step="5" oninput="updateTransformFromUI()">
                </div>
            </div>

            <div id="material-section">
                <div class="section-title" style="margin-top: 10px;">Material & Textura</div>
                <div class="input-group">
                    <label>Color</label>
                    <input type="color" id="obj-color" onchange="updateSelectedObject()">
                </div>
                <div class="input-group">
                    <label>Textura</label>
                    <input type="file" id="obj-texture" accept="image/*" style="width: 130px;" onchange="uploadTexture(event)">
                </div>
                <button id="btn-remove-texture" style="width: 100%; margin-bottom: 8px; display: none;" onclick="removeTexture()">Quitar Textura</button>

                <div class="input-group">
                    <label>Wireframe</label>
                    <input type="checkbox" id="obj-wireframe" onchange="updateSelectedObject()">
                </div>
            </div>

            <button class="btn-danger" style="width: 100%; margin-top: 10px;" onclick="deleteSelectedObject()">Eliminar Objeto</button>
        </div>

        <div class="section">
            <div class="section-title">Gizmo Transformación</div>
            <div style="display: flex; gap: 4px;">
                <button style="flex:1;" onclick="setTransformMode('translate')">Mover (G)</button>
                <button style="flex:1;" onclick="setTransformMode('rotate')">Rotar (R)</button>
                <button style="flex:1;" onclick="setTransformMode('scale')">Escalar (S)</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Escena</div>
            <div class="input-group">
                <label>Ver Cuadrícula</label>
                <input type="checkbox" id="toggle-grid" checked onchange="toggleGrid(this.checked)">
            </div>
            <button style="width: 100%; margin-top: 5px;" onclick="exportOBJ()">💾 Exportar Modelo .OBJ</button>
        </div>
    </div>

    <div id="timeline-panel" class="panel" style="display: none;">
        <div class="timeline-controls">
            <div style="display: flex; gap: 6px; align-items: center;">
                <button id="btn-play" onclick="togglePlayback()">▶️ Reproducir</button>
                <button onclick="prevFrame()">◀ Ant.</button>
                <button onclick="nextFrame()">Sig. ▶</button>
                <span style="font-size: 12px; margin-left: 6px; color: #007acc;" id="frame-indicator">Frame: 1 / 1</span>
            </div>

            <div style="display: flex; gap: 6px; align-items: center;">
                <button onclick="addFrame()">➕ Nuevo Frame</button>
                <button onclick="copyFrame()">📋 Copiar Frame</button>
                <button class="btn-danger" onclick="deleteFrame()">🗑️ Eliminar</button>
            </div>

            <div style="display: flex; gap: 6px; align-items: center;">
                <label style="font-size: 11px; color: #aaa;">FPS:</label>
                <input type="number" id="fps-input" value="6" min="1" max="30" style="width: 45px;" onchange="updateFPS()">
                <button id="btn-record" class="btn-record" onclick="toggleWebMRecording()">🔴 Grabar WEBM</button>
            </div>
        </div>

        <div id="frame-strip" class="frame-strip-container"></div>
    </div>

    <div id="stats">FPS: <span id="fps">60</span> | Objetos: <span id="obj-count">0</span></div>

    <script>
        let scene, camera, renderer, orbitControls, transformControls;
        let objects = [];
        let selectedObject = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let gridHelper;
        const textureLoader = new THREE.TextureLoader();

        let currentMode = 'modeling';
        let frames = [];
        let currentFrameIndex = 0;
        let isPlaying = false;
        let animFPS = 6;
        let playInterval = null;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        let frameCount = 0;
        let lastTime = performance.now();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            gridHelper = new THREE.GridHelper(20, 20, 0x007acc, 0x444444);
            scene.add(gridHelper);

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;

            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.size = 0.75;
            scene.add(transformControls);

            transformControls.addEventListener('dragging-changed', function (event) {
                orbitControls.enabled = !event.value;
            });

            transformControls.addEventListener('change', function () {
                if (selectedObject) {
                    updateUIFromObject(selectedObject);
                    saveCurrentFrameTransforms();
                }
            });

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);

            window.addEventListener('keydown', function(e) {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                if (e.key === 'g' || e.key === 'G') setTransformMode('translate');
                if (e.key === 'r' || e.key === 'R') setTransformMode('rotate');
                if (e.key === 's' || e.key === 'S') setTransformMode('scale');
                if (e.key === ' ') { e.preventDefault(); togglePlayback(); }
                if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedObject();
            });

            addPrimitive('cube');
            addFrame();

            animate();
        }

        /* --- Funciones de Proyecto: Nuevo, Cargar y Guardar --- */
        function newProject() {
            if (objects.length > 0 && !confirm("¿Quieres iniciar un proyecto nuevo? Se borrarán los objetos y fotogramas actuales.")) {
                return;
            }

            if (isPlaying) stopPlayback();
            selectObject(null);

            // Eliminar objetos existentes
            objects.forEach(obj => {
                scene.remove(obj);
                obj.geometry.dispose();
                if (obj.material.map) obj.material.map.dispose();
                obj.material.dispose();
            });
            objects = [];

            // Reiniciar animación y fotogramas
            frames = [];
            currentFrameIndex = 0;

            // Agregar cubo inicial por defecto
            addPrimitive('cube');
            saveCurrentFrameTransforms();
            renderFrameStrip();
            updateObjCount();
        }

        function saveProject() {
            saveCurrentFrameTransforms();

            const projectData = {
                version: "1.0",
                fps: animFPS,
                objects: objects.map(obj => ({
                    uuid: obj.uuid,
                    name: obj.name,
                    type: obj.geometry.type,
                    color: '#' + obj.material.color.getHexString(),
                    wireframe: obj.material.wireframe
                })),
                frames: frames
            };

            const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `proyecto_3d_${Date.now()}.json`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function loadProject(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.objects || !data.frames) {
                        alert("El archivo seleccionado no tiene un formato válido de proyecto 3D.");
                        return;
                    }

                    if (isPlaying) stopPlayback();
                    selectObject(null);

                    // Limpiar escena actual
                    objects.forEach(obj => {
                        scene.remove(obj);
                        obj.geometry.dispose();
                        if (obj.material.map) obj.material.map.dispose();
                        obj.material.dispose();
                    });
                    objects = [];

                    // Reconstruir objetos
                    data.objects.forEach(objData => {
                        let geometry;
                        const type = objData.type;

                        if (type.includes('Box')) geometry = new THREE.BoxGeometry(1, 1, 1);
                        else if (type.includes('Sphere')) geometry = new THREE.SphereGeometry(0.75, 24, 24);
                        else if (type.includes('Cylinder')) geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 24);
                        else if (type.includes('Plane')) geometry = new THREE.PlaneGeometry(2, 2);
                        else if (type.includes('Torus')) geometry = new THREE.TorusGeometry(0.6, 0.2, 16, 24);
                        else geometry = new THREE.BoxGeometry(1, 1, 1);

                        const material = new THREE.MeshStandardMaterial({
                            color: objData.color || 0xffffff,
                            wireframe: !!objData.wireframe,
                            roughness: 0.4,
                            metalness: 0.1
                        });
                        if (type.includes('Plane')) material.side = THREE.DoubleSide;

                        const mesh = new THREE.Mesh(geometry, material);
                        mesh.name = objData.name || "Objeto";
                        mesh.uuid = objData.uuid;
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;

                        scene.add(mesh);
                        objects.push(mesh);
                    });

                    // Cargar fotogramas y configuración
                    frames = data.frames;
                    currentFrameIndex = 0;

                    if (data.fps) {
                        animFPS = data.fps;
                        document.getElementById('fps-input').value = animFPS;
                    }

                    applyFrameTransforms(0);
                    updateObjCount();
                } catch (err) {
                    alert("Error al procesar el archivo del proyecto.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Resetear selector de archivo
        }

        /* --- Gestión de Modo y Animación --- */
        function switchMode(mode) {
            currentMode = mode;
            if(isPlaying) stopPlayback();

            document.getElementById('btn-mode-model').classList.toggle('active', mode === 'modeling');
            document.getElementById('btn-mode-anim').classList.toggle('active', mode === 'animation');

            document.getElementById('timeline-panel').style.display = (mode === 'animation') ? 'flex' : 'none';
            document.getElementById('panel-title').innerText = (mode === 'modeling') ? '⚙️ Inspector Modelado' : '🎬 Inspector Animación';
        }

        function captureSceneTransforms() {
            const frameData = {};
            objects.forEach(obj => {
                frameData[obj.uuid] = {
                    pos: obj.position.toArray(),
                    rot: [obj.rotation.x, obj.rotation.y, obj.rotation.z],
                    scale: obj.scale.toArray()
                };
            });
            return frameData;
        }

        function applyFrameTransforms(frameIndex) {
            if (!frames[frameIndex]) return;
            const frameData = frames[frameIndex];

            objects.forEach(obj => {
                if (frameData[obj.uuid]) {
                    const data = frameData[obj.uuid];
                    obj.position.fromArray(data.pos);
                    obj.rotation.set(data.rot[0], data.rot[1], data.rot[2]);
                    obj.scale.fromArray(data.scale);
                }
            });

            if (selectedObject) updateUIFromObject(selectedObject);
            renderFrameStrip();
        }

        function saveCurrentFrameTransforms() {
            if (frames.length === 0) return;
            frames[currentFrameIndex] = captureSceneTransforms();
        }

        function addFrame() {
            saveCurrentFrameTransforms();
            const newFrame = captureSceneTransforms();
            frames.splice(currentFrameIndex + 1, 0, newFrame);
            currentFrameIndex++;
            applyFrameTransforms(currentFrameIndex);
        }

        function copyFrame() {
            if (frames.length === 0) return;
            saveCurrentFrameTransforms();
            const copiedFrame = JSON.parse(JSON.stringify(frames[currentFrameIndex]));
            frames.splice(currentFrameIndex + 1, 0, copiedFrame);
            currentFrameIndex++;
            applyFrameTransforms(currentFrameIndex);
        }

        function deleteFrame() {
            if (frames.length <= 1) {
                alert("Debes mantener al menos 1 frame en la animación.");
                return;
            }
            frames.splice(currentFrameIndex, 1);
            if (currentFrameIndex >= frames.length) currentFrameIndex = frames.length - 1;
            applyFrameTransforms(currentFrameIndex);
        }

        function goToFrame(index) {
            if (index < 0 || index >= frames.length) return;
            saveCurrentFrameTransforms();
            currentFrameIndex = index;
            applyFrameTransforms(currentFrameIndex);
        }

        function nextFrame() {
            if (currentFrameIndex < frames.length - 1) {
                goToFrame(currentFrameIndex + 1);
            } else {
                goToFrame(0);
            }
        }

        function prevFrame() {
            if (currentFrameIndex > 0) {
                goToFrame(currentFrameIndex - 1);
            }
        }

        function updateFPS() {
            animFPS = parseInt(document.getElementById('fps-input').value) || 6;
            if (isPlaying) {
                stopPlayback();
                startPlayback();
            }
        }

        function togglePlayback() {
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            isPlaying = true;
            document.getElementById('btn-play').innerText = '⏸️ Pausar';
            transformControls.detach();
            playInterval = setInterval(() => {
                nextFrame();
            }, 1000 / animFPS);
        }

        function stopPlayback() {
            isPlaying = false;
            document.getElementById('btn-play').innerText = '▶️ Reproducir';
            clearInterval(playInterval);
            if (selectedObject && !isRecording) transformControls.attach(selectedObject);
        }

        function renderFrameStrip() {
            const container = document.getElementById('frame-strip');
            container.innerHTML = '';

            frames.forEach((_, idx) => {
                const card = document.createElement('div');
                card.className = `frame-card ${idx === currentFrameIndex ? 'active' : ''}`;
                card.innerHTML = `<span>Frame</span><strong>#${idx + 1}</strong>`;
                card.onclick = () => {
                    if (isPlaying) stopPlayback();
                    goToFrame(idx);
                };
                container.appendChild(card);
            });

            document.getElementById('frame-indicator').innerText = `Frame: ${currentFrameIndex + 1} / ${frames.length}`;
        }

        function toggleWebMRecording() {
            if (isRecording) {
                stopWebMRecording();
            } else {
                startWebMRecording();
            }
        }

        function startWebMRecording() {
            const canvas = renderer.domElement;
            const stream = canvas.captureStream(30);
            
            let options = { mimeType: 'video/webm;codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm;codecs=vp8' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }
            }

            recordedChunks = [];
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                alert('Tu navegador no soporta grabación en formato WebM.');
                return;
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.URL ? URL.createObjectURL(blob) : webkitURL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `animacion_3d_${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            };

            mediaRecorder.start();
            isRecording = true;

            const btnRecord = document.getElementById('btn-record');
            btnRecord.classList.add('recording');
            btnRecord.innerText = '⏹️ Detener Grabación';

            goToFrame(0);
            if (!isPlaying) startPlayback();
        }

        function stopWebMRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;

            const btnRecord = document.getElementById('btn-record');
            btnRecord.classList.remove('recording');
            btnRecord.innerText = '🔴 Grabar WEBM';

            if (isPlaying) stopPlayback();
        }

        function addPrimitive(type) {
            let geometry, mesh;
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.4,
                metalness: 0.1
            });

            switch(type) {
                case 'cube': geometry = new THREE.BoxGeometry(1, 1, 1); break;
                case 'sphere': geometry = new THREE.SphereGeometry(0.75, 24, 24); break;
                case 'cylinder': geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 24); break;
                case 'plane': geometry = new THREE.PlaneGeometry(2, 2); material.side = THREE.DoubleSide; break;
                case 'torus': geometry = new THREE.TorusGeometry(0.6, 0.2, 16, 24); break;
            }

            mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.5, 0);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.name = type.charAt(0).toUpperCase() + type.slice(1) + " " + (objects.length + 1);

            scene.add(mesh);
            objects.push(mesh);

            frames.forEach(f => {
                if (!f[mesh.uuid]) {
                    f[mesh.uuid] = {
                        pos: mesh.position.toArray(),
                        rot: [mesh.rotation.x, mesh.rotation.y, mesh.rotation.z],
                        scale: mesh.scale.toArray()
                    };
                }
            });

            selectObject(mesh);
            updateObjCount();
        }

        function onPointerDown(event) {
            if (isPlaying || isRecording) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                if (transformControls.dragging) return;
                selectObject(intersects[0].object);
            }
        }

        function selectObject(obj) {
            selectedObject = obj;
            if (obj) {
                if(!isPlaying && !isRecording) transformControls.attach(obj);
                document.getElementById('no-selection').style.display = 'none';
                document.getElementById('inspector-content').style.display = 'block';
                updateUIFromObject(obj);
            } else {
                transformControls.detach();
                document.getElementById('no-selection').style.display = 'block';
                document.getElementById('inspector-content').style.display = 'none';
            }
        }

        function updateUIFromObject(obj) {
            document.getElementById('obj-name').value = obj.name;
            document.getElementById('pos-x').value = obj.position.x.toFixed(2);
            document.getElementById('pos-y').value = obj.position.y.toFixed(2);
            document.getElementById('pos-z').value = obj.position.z.toFixed(2);

            document.getElementById('scale-x').value = obj.scale.x.toFixed(2);
            document.getElementById('scale-y').value = obj.scale.y.toFixed(2);
            document.getElementById('scale-z').value = obj.scale.z.toFixed(2);

            document.getElementById('rot-x').value = THREE.MathUtils.radToDeg(obj.rotation.x).toFixed(0);
            document.getElementById('rot-y').value = THREE.MathUtils.radToDeg(obj.rotation.y).toFixed(0);
            document.getElementById('rot-z').value = THREE.MathUtils.radToDeg(obj.rotation.z).toFixed(0);

            document.getElementById('obj-color').value = '#' + obj.material.color.getHexString();
            document.getElementById('obj-wireframe').checked = obj.material.wireframe;
            document.getElementById('btn-remove-texture').style.display = obj.material.map ? 'block' : 'none';
        }

        function updateTransformFromUI() {
            if (!selectedObject) return;
            selectedObject.position.set(
                parseFloat(document.getElementById('pos-x').value) || 0,
                parseFloat(document.getElementById('pos-y').value) || 0,
                parseFloat(document.getElementById('pos-z').value) || 0
            );
            selectedObject.scale.set(
                parseFloat(document.getElementById('scale-x').value) || 1,
                parseFloat(document.getElementById('scale-y').value) || 1,
                parseFloat(document.getElementById('scale-z').value) || 1
            );
            selectedObject.rotation.set(
                THREE.MathUtils.degToRad(parseFloat(document.getElementById('rot-x').value) || 0),
                THREE.MathUtils.degToRad(parseFloat(document.getElementById('rot-y').value) || 0),
                THREE.MathUtils.degToRad(parseFloat(document.getElementById('rot-z').value) || 0)
            );
            saveCurrentFrameTransforms();
        }

        function updateSelectedObject() {
            if (!selectedObject) return;
            selectedObject.name = document.getElementById('obj-name').value;
            selectedObject.material.color.set(document.getElementById('obj-color').value);
            selectedObject.material.wireframe = document.getElementById('obj-wireframe').checked;
        }

        function uploadTexture(event) {
            if (!selectedObject) return;
            const file = event.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            textureLoader.load(url, function(texture) {
                if (selectedObject.material.map) selectedObject.material.map.dispose();
                texture.encoding = THREE.sRGBEncoding;
                selectedObject.material.map = texture;
                selectedObject.material.needsUpdate = true;
                document.getElementById('btn-remove-texture').style.display = 'block';
            });
        }

        function removeTexture() {
            if (!selectedObject) return;
            if (selectedObject.material.map) {
                selectedObject.material.map.dispose();
                selectedObject.material.map = null;
                selectedObject.material.needsUpdate = true;
            }
            document.getElementById('obj-texture').value = '';
            document.getElementById('btn-remove-texture').style.display = 'none';
        }

        function setTransformMode(mode) {
            transformControls.setMode(mode);
        }

        function deleteSelectedObject() {
            if (!selectedObject) return;
            const targetUuid = selectedObject.uuid;

            transformControls.detach();
            scene.remove(selectedObject);
            
            selectedObject.geometry.dispose();
            if (selectedObject.material.map) selectedObject.material.map.dispose();
            selectedObject.material.dispose();

            objects = objects.filter(o => o !== selectedObject);
            frames.forEach(f => delete f[targetUuid]);

            selectedObject = null;
            selectObject(null);
            updateObjCount();
        }

        function toggleGrid(visible) {
            gridHelper.visible = visible;
        }

        function updateObjCount() {
            document.getElementById('obj-count').innerText = objects.length;
        }

        function exportOBJ() {
            if(objects.length === 0) return alert("No hay objetos en la escena.");
            let output = "# Exportado desde 3D Model Engine\n";
            let vertexOffset = 1;

            objects.forEach((obj, idx) => {
                output += `o Objeto_${idx+1}\n`;
                const geometry = obj.geometry.clone();
                geometry.applyMatrix4(obj.matrixWorld);

                const positions = geometry.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    output += `v ${positions.getX(i).toFixed(4)} ${positions.getY(i).toFixed(4)} ${positions.getZ(i).toFixed(4)}\n`;
                }

                if (geometry.index) {
                    const indices = geometry.index;
                    for (let i = 0; i < indices.count; i += 3) {
                        output += `f ${indices.getX(i) + vertexOffset} ${indices.getY(i) + vertexOffset} ${indices.getZ(i) + vertexOffset}\n`;
                    }
                }
                vertexOffset += positions.count;
            });

            const blob = new Blob([output], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'escena_3d.obj';
            link.click();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            orbitControls.update();
            renderer.render(scene, camera);

            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = frameCount;
                frameCount = 0;
                lastTime = now;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
