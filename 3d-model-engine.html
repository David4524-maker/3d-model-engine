<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Engine</title>
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Browser-based 3D modeling and frame-by-frame animation tool.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .panel {
            position: absolute;
            background: rgba(24, 24, 28, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #toolbar {
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        #sidebar {
            top: 15px;
            right: 15px;
            width: 290px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #timeline-panel {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 30px);
            max-width: 950px;
        }
        .timeline-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .frame-strip-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 6px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .frame-card {
            min-width: 50px;
            height: 45px;
            background: #1e2024;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
            color: #aaa;
            transition: all 0.2s ease;
        }
        .frame-card:hover {
            border-color: #007acc;
            color: #fff;
        }
        .frame-card.active {
            background: #007acc;
            border-color: #007acc;
            color: #fff;
            font-weight: bold;
        }
        .mode-selector {
            display: flex;
            background: #111;
            border-radius: 6px;
            padding: 2px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .mode-btn {
            background: transparent;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            color: #888;
            border-radius: 4px;
        }
        .mode-btn.active {
            background: #007acc;
            color: #fff;
        }
        h1 {
            font-size: 15px;
            font-weight: 600;
            color: #007acc;
            margin-bottom: 6px;
        }
        .section {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }
        button {
            background: #2a2d32;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #007acc;
            border-color: #007acc;
        }
        .btn-danger:hover {
            background: #d9534f;
            border-color: #d9534f;
        }
        .btn-record {
            background: #b32d2e;
            border-color: #e53935;
            font-weight: bold;
        }
        .btn-record:hover {
            background: #e53935;
            border-color: #ff5252;
        }
        .btn-record.recording {
            animation: pulse 1.2s infinite;
            background: #ff1744;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .input-group label {
            color: #ccc;
        }
        input[type="number"], input[type="text"], input[type="color"], input[type="file"], select {
            background: #111;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        input[type="number"] {
            width: 55px;
        }
        input[type="color"] {
            padding: 0;
            width: 40px;
            height: 24px;
            cursor: pointer;
        }
        .vector3-input {
            display: flex;
            gap: 4px;
        }
        #stats {
            position: absolute;
            top: 15px;
            right: 320px;
            font-size: 11px;
            color: #aaa;
            background: rgba(0,0,0,0.6);
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-success {
            background: #2e7d32;
            border-color: #4caf50;
        }
        .btn-success:hover {
            background: #388e3c;
            border-color: #66bb6a;
        }

        /* --- Polish --- */
        input, select { user-select: text; }
        button { white-space: nowrap; }
        button:active { transform: translateY(1px); }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #4fb3ff; outline-offset: 1px; }
        .frame-card:focus-visible { outline: 2px solid #4fb3ff; }
        select { cursor: pointer; }
        #lang { max-width: 120px; }
        #toolbar { max-width: calc(100% - 340px); }
        #sidebar { scrollbar-width: thin; scrollbar-color: #444 transparent; }
        .frame-strip-container { scrollbar-width: thin; scrollbar-color: #444 transparent; }
        @media (max-width: 900px) { #stats { display: none; } }
        @media (max-width: 700px) {
            #sidebar { width: 210px; max-height: 45vh; }
            #toolbar { max-width: calc(100% - 250px); }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="toolbar" class="panel">
        <strong style="font-size: 14px; margin-right: 8px;">🧊 3D Model Engine</strong>
        
        <!-- Project Management (New, Load, Save) -->
        <div style="display: flex; gap: 6px;">
            <button onclick="newProject()" data-i18n="new">📄 New</button>
            <button onclick="document.getElementById('file-load-project').click()" data-i18n="load">📂 Load</button>
            <button class="btn-success" onclick="saveProject()" data-i18n="save">💾 Save</button>
            <input type="file" id="file-load-project" accept=".json" style="display:none;" onchange="loadProject(event)">
        </div>

        <span style="color: rgba(255,255,255,0.2);">|</span>

        <div class="mode-selector">
            <button id="btn-mode-model" class="mode-btn active" onclick="switchMode('modeling')" data-i18n="modeling">📐 Modeling</button>
            <button id="btn-mode-anim" class="mode-btn" onclick="switchMode('animation')" data-i18n="animation">🎬 Animation</button>
        </div>

        <span style="color: rgba(255,255,255,0.2);">|</span>

        <div id="object-tools" style="display: flex; gap: 6px;">
            <button onclick="addPrimitive('cube')" data-i18n="cube">+ Cube</button>
            <button onclick="addPrimitive('sphere')" data-i18n="sphere">+ Sphere</button>
            <button onclick="addPrimitive('cylinder')" data-i18n="cylinder">+ Cylinder</button>
            <button onclick="addPrimitive('plane')" data-i18n="plane">+ Plane</button>
            <button onclick="addPrimitive('torus')" data-i18n="torus">+ Torus</button>
        </div>
        <select id="lang" aria-label="Language" onchange="setLang(this.value)"></select>
    </div>

    <div id="sidebar" class="panel">
        <div>
            <h1 id="panel-title" data-i18n="inspM">⚙️ Inspector</h1>
            <div id="no-selection" style="color: #666; font-size: 12px;" data-i18n="noSel">Click on an object to select it.</div>
        </div>

        <div id="inspector-content" style="display: none;" class="section">
            <div class="input-group">
                <label data-i18n="name">Name:</label>
                <input type="text" id="obj-name" style="width: 120px;" onchange="updateSelectedObject()">
            </div>
            
            <div class="section-title" style="margin-top: 10px;" data-i18n="transform">Transform</div>
            <div class="input-group">
                <label data-i18n="position">Position (X,Y,Z)</label>
                <div class="vector3-input">
                    <input type="number" id="pos-x" step="0.1" oninput="updateTransformFromUI()">
                    <input type="number" id="pos-y" step="0.1" oninput="updateTransformFromUI()">
                    <input type="number" id="pos-z" step="0.1" oninput="updateTransformFromUI()">
                </div>
            </div>
            <div class="input-group">
                <label data-i18n="scale">Scale (X,Y,Z)</label>
                <div class="vector3-input">
                    <input type="number" id="scale-x" step="0.1" oninput="updateTransformFromUI()">
                    <input type="number" id="scale-y" step="0.1" oninput="updateTransformFromUI()">
                    <input type="number" id="scale-z" step="0.1" oninput="updateTransformFromUI()">
                </div>
            </div>
            <div class="input-group">
                <label data-i18n="rotation">Rotation (°)</label>
                <div class="vector3-input">
                    <input type="number" id="rot-x" step="5" oninput="updateTransformFromUI()">
                    <input type="number" id="rot-y" step="5" oninput="updateTransformFromUI()">
                    <input type="number" id="rot-z" step="5" oninput="updateTransformFromUI()">
                </div>
            </div>

            <div id="material-section">
                <div class="section-title" style="margin-top: 10px;" data-i18n="material">Material & Texture</div>
                <div class="input-group">
                    <label data-i18n="color">Color</label>
                    <input type="color" id="obj-color" onchange="updateSelectedObject()">
                </div>
                <div class="input-group">
                    <label data-i18n="texture">Texture</label>
                    <input type="file" id="obj-texture" accept="image/*" style="width: 130px;" onchange="uploadTexture(event)">
                </div>
                <button id="btn-remove-texture" style="width: 100%; margin-bottom: 8px; display: none;" onclick="removeTexture()" data-i18n="rmTex">Remove Texture</button>

                <div class="input-group">
                    <label data-i18n="wire">Wireframe</label>
                    <input type="checkbox" id="obj-wireframe" onchange="updateSelectedObject()">
                </div>
            </div>

            <button class="btn-danger" style="width: 100%; margin-top: 10px;" onclick="deleteSelectedObject()" data-i18n="del">Delete Object</button>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="gizmo">Transform Gizmo</div>
            <div style="display: flex; gap: 4px;">
                <button style="flex:1;" onclick="setTransformMode('translate')" data-i18n="move">Move (G)</button>
                <button style="flex:1;" onclick="setTransformMode('rotate')" data-i18n="rotate">Rotate (R)</button>
                <button style="flex:1;" onclick="setTransformMode('scale')" data-i18n="scale" data-a="scaleB">Scale (S)</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="scene">Scene</div>
            <div class="input-group">
                <label data-i18n="grid">Show Grid</label>
                <input type="checkbox" id="toggle-grid" checked onchange="toggleGrid(this.checked)">
            </div>
            <button style="width: 100%; margin-top: 5px;" onclick="exportOBJ()" data-i18n="exportObj">💾 Export .OBJ Model</button>
        </div>
    </div>

    <div id="timeline-panel" class="panel" style="display: none;">
        <div class="timeline-controls">
            <div style="display: flex; gap: 6px; align-items: center;">
                <button id="btn-play" onclick="togglePlayback()" data-i18n="play">▶️ Play</button>
                <button onclick="prevFrame()" data-i18n="prev">◀ Prev</button>
                <button onclick="nextFrame()" data-i18n="next">Next ▶</button>
                <span style="font-size: 12px; margin-left: 6px; color: #007acc;" id="frame-indicator">Frame: 1 / 1</span>
            </div>

            <div style="display: flex; gap: 6px; align-items: center;">
                <button onclick="addFrame()" data-i18n="newFrame">➕ New Frame</button>
                <button onclick="copyFrame()" data-i18n="copyFrame">📋 Copy Frame</button>
                <button class="btn-danger" onclick="deleteFrame()" data-i18n="delFrame">🗑️ Delete</button>
            </div>

            <div style="display: flex; gap: 6px; align-items: center;">
                <label style="font-size: 11px; color: #aaa;" data-i18n="fps">FPS:</label>
                <input type="number" id="fps-input" value="6" min="1" max="30" style="width: 45px;" onchange="updateFPS()">
                <button id="btn-record" class="btn-record" onclick="toggleWebMRecording()" data-i18n="rec">🔴 Record WEBM</button>
            </div>
        </div>

        <div id="frame-strip" class="frame-strip-container"></div>
    </div>

    <div id="stats"><span data-i18n="fps">FPS</span> <span id="fps">60</span> | <span data-i18n="objs">Objects</span> <span id="obj-count">0</span></div>

    <script>
        /* --- i18n (11 languages) --- */
        const KEYS = "new load save modeling animation cube sphere cylinder plane torus inspM inspA noSel name transform position scale rotation material color texture rmTex wire del gizmo move rotate scene grid exportObj play pause prev next newFrame copyFrame delFrame fps rec stopRec objs frame confNew errEmpty errKeep errRec errProj".split(' ');
        const DICT = {
            en: `New|Load|Save|Modeling|Animation|Cube|Sphere|Cylinder|Plane|Torus|Modeling Inspector|Animation Inspector|Click on an object to select it.|Name|Transform|Position|Scale|Rotation|Material & Texture|Color|Texture|Remove Texture|Wireframe|Delete Object|Transform Gizmo|Move|Rotate|Scene|Show Grid|Export .OBJ Model|Play|Pause|Prev|Next|New Frame|Copy Frame|Delete|FPS|Record WEBM|Stop Recording|Objects|Frame|Start a new project? Current objects and animation frames will be erased.|There are no objects in the scene.|You must keep at least 1 frame in the animation.|Your browser does not support WebM recording.|The selected file is not a valid 3D project.`,

            fr: `Nouveau|Ouvrir|Enregistrer|Modélisation|Animation|Cube|Sphère|Cylindre|Plan|Tore|Inspecteur de modélisation|Inspecteur d’animation|Cliquez sur un objet pour le sélectionner.|Nom|Transformation|Position|Échelle|Rotation|Matériau et texture|Couleur|Texture|Retirer la texture|Fil de fer|Supprimer l’objet|Manipulateur de transformation|Déplacer|Pivoter|Scène|Afficher la grille|Exporter le modèle .OBJ|Lecture|Pause|Préc.|Suiv.|Nouvelle image|Copier l’image|Supprimer|FPS|Enregistrer WEBM|Arrêter l’enregistrement|Objets|Image|Démarrer un nouveau projet ? Les objets et images actuels seront effacés.|Aucun objet dans la scène.|Vous devez conserver au moins 1 image dans l’animation.|Votre navigateur ne prend pas en charge l’enregistrement WebM.|Le fichier sélectionné n’est pas un projet 3D valide.`,
            de: `Neu|Laden|Speichern|Modellierung|Animation|Würfel|Kugel|Zylinder|Ebene|Torus|Modellierungs-Inspektor|Animations-Inspektor|Klicke auf ein Objekt, um es auszuwählen.|Name|Transformation|Position|Skalierung|Rotation|Material & Textur|Farbe|Textur|Textur entfernen|Drahtgitter|Objekt löschen|Transformations-Gizmo|Verschieben|Drehen|Szene|Raster anzeigen|.OBJ-Modell exportieren|Abspielen|Pause|Zurück|Weiter|Neues Bild|Bild kopieren|Löschen|FPS|WEBM aufnehmen|Aufnahme beenden|Objekte|Bild|Neues Projekt starten? Aktuelle Objekte und Animationsbilder werden gelöscht.|Die Szene enthält keine Objekte.|Mindestens 1 Bild muss in der Animation bleiben.|Dein Browser unterstützt keine WebM-Aufnahme.|Die gewählte Datei ist kein gültiges 3D-Projekt.`,
            pt: `Novo|Abrir|Salvar|Modelagem|Animação|Cubo|Esfera|Cilindro|Plano|Toro|Inspetor de modelagem|Inspetor de animação|Clique em um objeto para selecioná-lo.|Nome|Transformação|Posição|Escala|Rotação|Material e textura|Cor|Textura|Remover textura|Wireframe|Excluir objeto|Gizmo de transformação|Mover|Girar|Cena|Mostrar grade|Exportar modelo .OBJ|Reproduzir|Pausar|Anterior|Próximo|Novo quadro|Copiar quadro|Excluir|FPS|Gravar WEBM|Parar gravação|Objetos|Quadro|Iniciar um novo projeto? Os objetos e quadros atuais serão apagados.|Não há objetos na cena.|Você deve manter pelo menos 1 quadro na animação.|Seu navegador não suporta gravação WebM.|O arquivo selecionado não é um projeto 3D válido.`,
            it: `Nuovo|Apri|Salva|Modellazione|Animazione|Cubo|Sfera|Cilindro|Piano|Toro|Ispettore di modellazione|Ispettore di animazione|Fai clic su un oggetto per selezionarlo.|Nome|Trasformazione|Posizione|Scala|Rotazione|Materiale e texture|Colore|Texture|Rimuovi texture|Wireframe|Elimina oggetto|Gizmo di trasformazione|Sposta|Ruota|Scena|Mostra griglia|Esporta modello .OBJ|Riproduci|Pausa|Indietro|Avanti|Nuovo fotogramma|Copia fotogramma|Elimina|FPS|Registra WEBM|Ferma registrazione|Oggetti|Fotogramma|Avviare un nuovo progetto? Gli oggetti e i fotogrammi attuali verranno cancellati.|Non ci sono oggetti nella scena.|Devi mantenere almeno 1 fotogramma nell’animazione.|Il tuo browser non supporta la registrazione WebM.|Il file selezionato non è un progetto 3D valido.`,
            ja: `新規|開く|保存|モデリング|アニメーション|立方体|球|円柱|平面|トーラス|モデリング インスペクター|アニメーション インスペクター|オブジェクトをクリックして選択します。|名前|トランスフォーム|位置|スケール|回転|マテリアルとテクスチャ|色|テクスチャ|テクスチャを削除|ワイヤーフレーム|オブジェクトを削除|トランスフォーム ギズモ|移動|回転|シーン|グリッドを表示|.OBJモデルを書き出し|再生|一時停止|前へ|次へ|新規フレーム|フレームをコピー|削除|FPS|WEBMを録画|録画を停止|オブジェクト|フレーム|新規プロジェクトを開始しますか？現在のオブジェクトとフレームは消去されます。|シーンにオブジェクトがありません。|アニメーションには少なくとも1フレームが必要です。|お使いのブラウザはWebM録画に対応していません。|選択したファイルは有効な3Dプロジェクトではありません。`,
            zh: `新建|打开|保存|建模|动画|立方体|球体|圆柱体|平面|圆环|建模检查器|动画检查器|点击对象以选中。|名称|变换|位置|缩放|旋转|材质与纹理|颜色|纹理|移除纹理|线框|删除对象|变换控制器|移动|旋转|场景|显示网格|导出 .OBJ 模型|播放|暂停|上一帧|下一帧|新建帧|复制帧|删除|FPS|录制 WEBM|停止录制|对象|帧|要新建项目吗？当前的对象和动画帧将被清除。|场景中没有对象。|动画中至少要保留 1 帧。|你的浏览器不支持 WebM 录制。|所选文件不是有效的 3D 项目。`,
            ko: `새로 만들기|불러오기|저장|모델링|애니메이션|큐브|구|원기둥|평면|토러스|모델링 인스펙터|애니메이션 인스펙터|오브젝트를 클릭하여 선택하세요.|이름|변형|위치|크기|회전|재질 및 텍스처|색상|텍스처|텍스처 제거|와이어프레임|오브젝트 삭제|변형 기즈모|이동|회전|장면|그리드 표시|.OBJ 모델 내보내기|재생|일시정지|이전|다음|새 프레임|프레임 복사|삭제|FPS|WEBM 녹화|녹화 중지|오브젝트|프레임|새 프로젝트를 시작할까요? 현재 오브젝트와 애니메이션 프레임이 삭제됩니다.|장면에 오브젝트가 없습니다.|애니메이션에는 최소 1개의 프레임이 필요합니다.|브라우저가 WebM 녹화를 지원하지 않습니다.|선택한 파일은 올바른 3D 프로젝트가 아닙니다.`,
            ru: `Новый|Открыть|Сохранить|Моделирование|Анимация|Куб|Сфера|Цилиндр|Плоскость|Тор|Инспектор моделирования|Инспектор анимации|Щёлкните объект, чтобы выбрать его.|Имя|Трансформация|Позиция|Масштаб|Вращение|Материал и текстура|Цвет|Текстура|Удалить текстуру|Каркас|Удалить объект|Гизмо трансформации|Перемещение|Поворот|Сцена|Показать сетку|Экспорт модели .OBJ|Воспроизвести|Пауза|Назад|Далее|Новый кадр|Копировать кадр|Удалить|FPS|Запись WEBM|Остановить запись|Объекты|Кадр|Начать новый проект? Текущие объекты и кадры анимации будут удалены.|В сцене нет объектов.|В анимации должен остаться хотя бы 1 кадр.|Ваш браузер не поддерживает запись WebM.|Выбранный файл не является допустимым 3D-проектом.`,
            tr: `Yeni|Aç|Kaydet|Modelleme|Animasyon|Küp|Küre|Silindir|Düzlem|Halka|Modelleme Denetçisi|Animasyon Denetçisi|Seçmek için bir nesneye tıklayın.|Ad|Dönüşüm|Konum|Ölçek|Döndürme|Malzeme ve Doku|Renk|Doku|Dokuyu Kaldır|Tel Kafes|Nesneyi Sil|Dönüşüm Gizmosu|Taşı|Döndür|Sahne|Izgarayı Göster|.OBJ Modelini Dışa Aktar|Oynat|Duraklat|Önceki|Sonraki|Yeni Kare|Kareyi Kopyala|Sil|FPS|WEBM Kaydet|Kaydı Durdur|Nesneler|Kare|Yeni proje başlatılsın mı? Mevcut nesneler ve animasyon kareleri silinecek.|Sahnede nesne yok.|Animasyonda en az 1 kare kalmalı.|Tarayıcınız WebM kaydını desteklemiyor.|Seçilen dosya geçerli bir 3D projesi değil.`
        };
        Object.keys(DICT).forEach(l => DICT[l] = DICT[l].split('|'));
        const LANGS = { en: 'English', es: 'Español', fr: 'Français', de: 'Deutsch', pt: 'Português', it: 'Italiano', ja: '日本語', zh: '中文', ko: '한국어', ru: 'Русский', tr: 'Türkçe' };
        const AFFIX = { new: ['📄 ', ''], load: ['📂 ', ''], save: ['💾 ', ''], modeling: ['📐 ', ''], animation: ['🎬 ', ''],
            cube: ['+ ', ''], sphere: ['+ ', ''], cylinder: ['+ ', ''], plane: ['+ ', ''], torus: ['+ ', ''],
            inspM: ['⚙️ ', ''], inspA: ['🎬 ', ''], name: ['', ':'], position: ['', ' (X,Y,Z)'], scale: ['', ' (X,Y,Z)'], scaleB: ['', ' (S)'],
            rotation: ['', ' (°)'], move: ['', ' (G)'], rotate: ['', ' (R)'], exportObj: ['💾 ', ''], play: ['▶️ ', ''], pause: ['⏸️ ', ''],
            prev: ['◀ ', ''], next: ['', ' ▶'], newFrame: ['➕ ', ''], copyFrame: ['📋 ', ''], delFrame: ['🗑️ ', ''], fps: ['', ':'],
            rec: ['🔴 ', ''], stopRec: ['⏹️ ', ''], objs: ['', ':'] };
        let lang = 'en';
        const t = k => { const i = KEYS.indexOf(k); return (DICT[lang] && DICT[lang][i]) || DICT.en[i] || k; };
        function applyEl(el) {
            const k = el.dataset.i18n, a = AFFIX[el.dataset.a || k] || ['', ''];
            el.textContent = a[0] + t(k) + a[1];
        }
        function setKey(id, key) { const el = document.getElementById(id); el.dataset.i18n = key; applyEl(el); }
        function setLang(l) {
            if (!DICT[l]) l = 'en';
            lang = l;
            try { localStorage.setItem('3dme-lang', l); } catch (e) {}
            document.documentElement.lang = l;
            document.getElementById('lang').value = l;
            document.querySelectorAll('[data-i18n]').forEach(applyEl);
            if (typeof renderFrameStrip === 'function' && frames.length) renderFrameStrip(true);
        }
        function initLang() {
            const sel = document.getElementById('lang');
            sel.innerHTML = Object.entries(LANGS).map(([c, n]) => `<option value="${c}">${n}</option>`).join('');
            let saved = null;
            try { saved = localStorage.getItem('3dme-lang'); } catch (e) {}
            setLang(saved || (navigator.language || 'en').slice(0, 2));
        }

        /* --- On-demand rendering: draw only when something changed --- */
        let needsRender = true;
        const invalidate = () => { needsRender = true; };

        let scene, camera, renderer, orbitControls, transformControls;
        let objects = [];
        let selectedObject = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let gridHelper;
        const textureLoader = new THREE.TextureLoader();

        let currentMode = 'modeling';
        let frames = [];
        let currentFrameIndex = 0;
        let isPlaying = false;
        let animFPS = 6;
        let playInterval = null;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        let frameCount = 0;
        let lastTime = performance.now();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            Object.assign(dirLight.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
            dirLight.shadow.camera.updateProjectionMatrix();
            scene.add(dirLight);

            gridHelper = new THREE.GridHelper(20, 20, 0x007acc, 0x444444);
            scene.add(gridHelper);

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;

            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.size = 0.75;
            scene.add(transformControls);

            transformControls.addEventListener('dragging-changed', function (event) {
                orbitControls.enabled = !event.value;
            });

            transformControls.addEventListener('change', function () {
                invalidate();
                if (selectedObject) {
                    updateUIFromObject(selectedObject);
                    if (transformControls.dragging) saveCurrentFrameTransforms();
                }
            });
            orbitControls.addEventListener('change', invalidate);
            document.getElementById('frame-strip').addEventListener('click', function (e) {
                const card = e.target.closest('.frame-card');
                if (!card) return;
                if (isPlaying) stopPlayback();
                goToFrame(parseInt(card.dataset.i, 10));
            });

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);

            window.addEventListener('keydown', function(e) {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
                if (e.key === 'g' || e.key === 'G') setTransformMode('translate');
                if (e.key === 'r' || e.key === 'R') setTransformMode('rotate');
                if (e.key === 's' || e.key === 'S') setTransformMode('scale');
                if (e.key === ' ') { e.preventDefault(); togglePlayback(); }
                if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedObject();
            });

            initLang();
            addPrimitive('cube');
            addFrame();

            animate();
        }

        /* --- Project Functions: New, Load, and Save --- */
        function newProject() {
            if (objects.length > 0 && !confirm(t('confNew'))) {
                return;
            }

            if (isPlaying) stopPlayback();
            selectObject(null);

            // Clear existing objects
            objects.forEach(obj => {
                scene.remove(obj);
                obj.geometry.dispose();
                if (obj.material.map) obj.material.map.dispose();
                obj.material.dispose();
            });
            objects = [];

            // Reset animation and frames
            frames = [];
            currentFrameIndex = 0;

            // Add initial default cube
            addPrimitive('cube');
            saveCurrentFrameTransforms();
            renderFrameStrip();
            updateObjCount();
        }

        function saveProject() {
            saveCurrentFrameTransforms();

            const projectData = {
                version: "1.0",
                fps: animFPS,
                objects: objects.map(obj => ({
                    uuid: obj.uuid,
                    name: obj.name,
                    type: obj.geometry.type,
                    color: '#' + obj.material.color.getHexString(),
                    wireframe: obj.material.wireframe
                })),
                frames: frames
            };

            const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `3d_project_${Date.now()}.json`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function loadProject(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.objects || !data.frames) {
                        alert(t('errProj'));
                        return;
                    }

                    if (isPlaying) stopPlayback();
                    selectObject(null);

                    // Clear current scene
                    objects.forEach(obj => {
                        scene.remove(obj);
                        obj.geometry.dispose();
                        if (obj.material.map) obj.material.map.dispose();
                        obj.material.dispose();
                    });
                    objects = [];

                    // Reconstruct objects
                    data.objects.forEach(objData => {
                        let geometry;
                        const type = objData.type;

                        if (type.includes('Box')) geometry = new THREE.BoxGeometry(1, 1, 1);
                        else if (type.includes('Sphere')) geometry = new THREE.SphereGeometry(0.75, 24, 24);
                        else if (type.includes('Cylinder')) geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 24);
                        else if (type.includes('Plane')) geometry = new THREE.PlaneGeometry(2, 2);
                        else if (type.includes('Torus')) geometry = new THREE.TorusGeometry(0.6, 0.2, 16, 24);
                        else geometry = new THREE.BoxGeometry(1, 1, 1);

                        const material = new THREE.MeshStandardMaterial({
                            color: objData.color || 0xffffff,
                            wireframe: !!objData.wireframe,
                            roughness: 0.4,
                            metalness: 0.1
                        });
                        if (type.includes('Plane')) material.side = THREE.DoubleSide;

                        const mesh = new THREE.Mesh(geometry, material);
                        mesh.name = objData.name || "Object";
                        mesh.uuid = objData.uuid;
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;

                        scene.add(mesh);
                        objects.push(mesh);
                    });

                    // Load frames and configuration
                    frames = data.frames;
                    currentFrameIndex = 0;

                    if (data.fps) {
                        animFPS = data.fps;
                        document.getElementById('fps-input').value = animFPS;
                    }

                    applyFrameTransforms(0);
                    updateObjCount();
                } catch (err) {
                    alert(t('errProj'));
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset file selector
        }

        /* --- Mode & Animation Management --- */
        function switchMode(mode) {
            currentMode = mode;
            if(isPlaying) stopPlayback();

            document.getElementById('btn-mode-model').classList.toggle('active', mode === 'modeling');
            document.getElementById('btn-mode-anim').classList.toggle('active', mode === 'animation');

            document.getElementById('timeline-panel').style.display = (mode === 'animation') ? 'flex' : 'none';
            setKey('panel-title', mode === 'modeling' ? 'inspM' : 'inspA');
        }

        function captureSceneTransforms() {
            const frameData = {};
            objects.forEach(obj => {
                frameData[obj.uuid] = {
                    pos: obj.position.toArray(),
                    rot: [obj.rotation.x, obj.rotation.y, obj.rotation.z],
                    scale: obj.scale.toArray()
                };
            });
            return frameData;
        }

        function applyFrameTransforms(frameIndex) {
            invalidate();
            if (!frames[frameIndex]) return;
            const frameData = frames[frameIndex];

            objects.forEach(obj => {
                if (frameData[obj.uuid]) {
                    const data = frameData[obj.uuid];
                    obj.position.fromArray(data.pos);
                    obj.rotation.set(data.rot[0], data.rot[1], data.rot[2]);
                    obj.scale.fromArray(data.scale);
                }
            });

            if (selectedObject) updateUIFromObject(selectedObject);
            renderFrameStrip();
        }

        function saveCurrentFrameTransforms() {
            if (frames.length === 0) return;
            frames[currentFrameIndex] = captureSceneTransforms();
        }

        function addFrame() {
            saveCurrentFrameTransforms();
            const newFrame = captureSceneTransforms();
            frames.splice(currentFrameIndex + 1, 0, newFrame);
            currentFrameIndex++;
            applyFrameTransforms(currentFrameIndex);
        }

        function copyFrame() {
            if (frames.length === 0) return;
            saveCurrentFrameTransforms();
            const copiedFrame = JSON.parse(JSON.stringify(frames[currentFrameIndex]));
            frames.splice(currentFrameIndex + 1, 0, copiedFrame);
            currentFrameIndex++;
            applyFrameTransforms(currentFrameIndex);
        }

        function deleteFrame() {
            if (frames.length <= 1) {
                alert(t('errKeep'));
                return;
            }
            frames.splice(currentFrameIndex, 1);
            if (currentFrameIndex >= frames.length) currentFrameIndex = frames.length - 1;
            applyFrameTransforms(currentFrameIndex);
        }

        function goToFrame(index) {
            if (index < 0 || index >= frames.length) return;
            saveCurrentFrameTransforms();
            currentFrameIndex = index;
            applyFrameTransforms(currentFrameIndex);
        }

        function nextFrame() {
            if (currentFrameIndex < frames.length - 1) {
                goToFrame(currentFrameIndex + 1);
            } else {
                goToFrame(0);
            }
        }

        function prevFrame() {
            if (currentFrameIndex > 0) {
                goToFrame(currentFrameIndex - 1);
            }
        }

        function updateFPS() {
            animFPS = parseInt(document.getElementById('fps-input').value) || 6;
            if (isPlaying) {
                stopPlayback();
                startPlayback();
            }
        }

        function togglePlayback() {
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            isPlaying = true;
            setKey('btn-play', 'pause');
            transformControls.detach();
            playInterval = setInterval(() => {
                nextFrame();
            }, 1000 / animFPS);
        }

        function stopPlayback() {
            isPlaying = false;
            setKey('btn-play', 'play');
            clearInterval(playInterval);
            invalidate();
            if (selectedObject && !isRecording) transformControls.attach(selectedObject);
        }

        function renderFrameStrip(force) {
            const box = document.getElementById('frame-strip');
            if (force || box.children.length !== frames.length) {
                const frag = document.createDocumentFragment();
                frames.forEach((_, idx) => {
                    const card = document.createElement('div');
                    card.className = 'frame-card';
                    card.dataset.i = idx;
                    card.innerHTML = `<span>${t('frame')}</span><strong>#${idx + 1}</strong>`;
                    frag.appendChild(card);
                });
                box.textContent = '';
                box.appendChild(frag);
            }
            for (let i = 0; i < box.children.length; i++) box.children[i].classList.toggle('active', i === currentFrameIndex);
            const cur = box.children[currentFrameIndex];
            if (cur && !isPlaying) cur.scrollIntoView({ inline: 'nearest', block: 'nearest' });
            document.getElementById('frame-indicator').textContent = `${t('frame')}: ${currentFrameIndex + 1} / ${frames.length}`;
        }

        function toggleWebMRecording() {
            if (isRecording) {
                stopWebMRecording();
            } else {
                startWebMRecording();
            }
        }

        function startWebMRecording() {
            const canvas = renderer.domElement;
            const stream = canvas.captureStream(30);
            
            let options = { mimeType: 'video/webm;codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm;codecs=vp8' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }
            }

            recordedChunks = [];
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                alert(t('errRec'));
                return;
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `3d_animation_${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            };

            mediaRecorder.start();
            isRecording = true;

            const btnRecord = document.getElementById('btn-record');
            btnRecord.classList.add('recording');
            setKey('btn-record', 'stopRec');

            goToFrame(0);
            if (!isPlaying) startPlayback();
        }

        function stopWebMRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;

            const btnRecord = document.getElementById('btn-record');
            btnRecord.classList.remove('recording');
            setKey('btn-record', 'rec');

            if (isPlaying) stopPlayback();
        }

        function addPrimitive(type) {
            let geometry, mesh;
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.4,
                metalness: 0.1
            });

            switch(type) {
                case 'cube': geometry = new THREE.BoxGeometry(1, 1, 1); break;
                case 'sphere': geometry = new THREE.SphereGeometry(0.75, 24, 24); break;
                case 'cylinder': geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 24); break;
                case 'plane': geometry = new THREE.PlaneGeometry(2, 2); material.side = THREE.DoubleSide; break;
                case 'torus': geometry = new THREE.TorusGeometry(0.6, 0.2, 16, 24); break;
            }

            mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.5, 0);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.name = t(type) + " " + (objects.length + 1);

            scene.add(mesh);
            objects.push(mesh);

            frames.forEach(f => {
                if (!f[mesh.uuid]) {
                    f[mesh.uuid] = {
                        pos: mesh.position.toArray(),
                        rot: [mesh.rotation.x, mesh.rotation.y, mesh.rotation.z],
                        scale: mesh.scale.toArray()
                    };
                }
            });

            selectObject(mesh);
            updateObjCount();
        }

        function onPointerDown(event) {
            if (isPlaying || isRecording) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                if (transformControls.dragging) return;
                selectObject(intersects[0].object);
            }
        }

        function selectObject(obj) {
            selectedObject = obj;
            if (obj) {
                if(!isPlaying && !isRecording) transformControls.attach(obj);
                document.getElementById('no-selection').style.display = 'none';
                document.getElementById('inspector-content').style.display = 'block';
                updateUIFromObject(obj);
            } else {
                transformControls.detach();
                document.getElementById('no-selection').style.display = 'block';
                document.getElementById('inspector-content').style.display = 'none';
            }
        }

        function updateUIFromObject(obj) {
            invalidate();
            document.getElementById('obj-name').value = obj.name;
            document.getElementById('pos-x').value = obj.position.x.toFixed(2);
            document.getElementById('pos-y').value = obj.position.y.toFixed(2);
            document.getElementById('pos-z').value = obj.position.z.toFixed(2);

            document.getElementById('scale-x').value = obj.scale.x.toFixed(2);
            document.getElementById('scale-y').value = obj.scale.y.toFixed(2);
            document.getElementById('scale-z').value = obj.scale.z.toFixed(2);

            document.getElementById('rot-x').value = THREE.MathUtils.radToDeg(obj.rotation.x).toFixed(0);
            document.getElementById('rot-y').value = THREE.MathUtils.radToDeg(obj.rotation.y).toFixed(0);
            document.getElementById('rot-z').value = THREE.MathUtils.radToDeg(obj.rotation.z).toFixed(0);

            document.getElementById('obj-color').value = '#' + obj.material.color.getHexString();
            document.getElementById('obj-wireframe').checked = obj.material.wireframe;
            document.getElementById('btn-remove-texture').style.display = obj.material.map ? 'block' : 'none';
        }

        function updateTransformFromUI() {
            invalidate();
            if (!selectedObject) return;
            selectedObject.position.set(
                parseFloat(document.getElementById('pos-x').value) || 0,
                parseFloat(document.getElementById('pos-y').value) || 0,
                parseFloat(document.getElementById('pos-z').value) || 0
            );
            selectedObject.scale.set(
                parseFloat(document.getElementById('scale-x').value) || 1,
                parseFloat(document.getElementById('scale-y').value) || 1,
                parseFloat(document.getElementById('scale-z').value) || 1
            );
            selectedObject.rotation.set(
                THREE.MathUtils.degToRad(parseFloat(document.getElementById('rot-x').value) || 0),
                THREE.MathUtils.degToRad(parseFloat(document.getElementById('rot-y').value) || 0),
                THREE.MathUtils.degToRad(parseFloat(document.getElementById('rot-z').value) || 0)
            );
            saveCurrentFrameTransforms();
        }

        function updateSelectedObject() {
            invalidate();
            if (!selectedObject) return;
            selectedObject.name = document.getElementById('obj-name').value;
            selectedObject.material.color.set(document.getElementById('obj-color').value);
            selectedObject.material.wireframe = document.getElementById('obj-wireframe').checked;
        }

        function uploadTexture(event) {
            if (!selectedObject) return;
            const file = event.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            textureLoader.load(url, function(texture) {
                if (selectedObject.material.map) selectedObject.material.map.dispose();
                texture.encoding = THREE.sRGBEncoding;
                URL.revokeObjectURL(url);
                invalidate();
                selectedObject.material.map = texture;
                selectedObject.material.needsUpdate = true;
                document.getElementById('btn-remove-texture').style.display = 'block';
            });
        }

        function removeTexture() {
            invalidate();
            if (!selectedObject) return;
            if (selectedObject.material.map) {
                selectedObject.material.map.dispose();
                selectedObject.material.map = null;
                selectedObject.material.needsUpdate = true;
            }
            document.getElementById('obj-texture').value = '';
            document.getElementById('btn-remove-texture').style.display = 'none';
        }

        function setTransformMode(mode) {
            invalidate();
            transformControls.setMode(mode);
        }

        function deleteSelectedObject() {
            if (!selectedObject) return;
            const targetUuid = selectedObject.uuid;

            transformControls.detach();
            scene.remove(selectedObject);
            
            selectedObject.geometry.dispose();
            if (selectedObject.material.map) selectedObject.material.map.dispose();
            selectedObject.material.dispose();

            objects = objects.filter(o => o !== selectedObject);
            frames.forEach(f => delete f[targetUuid]);

            selectedObject = null;
            selectObject(null);
            updateObjCount();
        }

        function toggleGrid(visible) {
            invalidate();
            gridHelper.visible = visible;
        }

        function updateObjCount() {
            invalidate();
            document.getElementById('obj-count').innerText = objects.length;
        }

        function exportOBJ() {
            if(objects.length === 0) return alert(t('errEmpty'));
            let output = "# Exported from 3D Model Engine\n";
            let vertexOffset = 1;

            objects.forEach((obj, idx) => {
                output += `o Object_${idx+1}\n`;
                const geometry = obj.geometry.clone();
                obj.updateMatrixWorld(true);
                geometry.applyMatrix4(obj.matrixWorld);

                const positions = geometry.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    output += `v ${positions.getX(i).toFixed(4)} ${positions.getY(i).toFixed(4)} ${positions.getZ(i).toFixed(4)}\n`;
                }

                if (geometry.index) {
                    const indices = geometry.index;
                    for (let i = 0; i < indices.count; i += 3) {
                        output += `f ${indices.getX(i) + vertexOffset} ${indices.getY(i) + vertexOffset} ${indices.getZ(i) + vertexOffset}\n`;
                    }
                }
                vertexOffset += positions.count;
            });

            const blob = new Blob([output], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '3d_scene.obj';
            link.click();
        }

        function onWindowResize() {
            invalidate();
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            orbitControls.update();
            if (needsRender || isPlaying || isRecording) {
                needsRender = false;
                renderer.render(scene, camera);
            }

            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = frameCount;
                frameCount = 0;
                lastTime = now;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
